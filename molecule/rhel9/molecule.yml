---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

# Driver configuration
driver:
  name: podman

# Platform configuration - RHEL container
platforms:
  - name: instance
    image: quay.io/ansible/molecule-rhel:latest
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /sbin/init
    pre_build_image: true

# Provisioner configuration
provisioner:
  name: ansible
  inventory:
    hosts:
      instance:
        ansible_connection: local
  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    side_effect: side_effect.yml
    verify: verify.yml

# Verifier configuration
verifier:
  name: ansible

# Scenario configuration
scenario:
  name: rhel
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
